- provider:
    name: "ollama.OllamaService"
    args:
      port: 11434
      host: "localhost"
  #models: ["llama3.1", "llama3.2:3b","llama3.2:1b","gemma2:2b","phi3.5:latest", "qwen2.5:0.5b", "qwen2.5:1.5b", "qwen2.5:3b", "qwen2.5:latest", "qwen2.5:14b", "qwen2.5:32b", "gemma2:27b", "llama3.1:70b", "mistral-small", "aya:35b", "qwen2.5:72b"]
  models: ["llama3.2:3b","llama3.2:1b","gemma2:2b","phi3.5:latest", "qwen2.5:0.5b", "qwen2.5:1.5b", "qwen2.5:3b"]

  classes: ["inserimento", "richiesta", "generale"]
  system: >
    Classifica l'input testuale in una delle seguenti categorie:
    "Inserimento": fornisce informazioni sull'utente (dati di salute, stile di vita, condizioni mediche, eventi specifici). Esempi: misurazioni di pressione sanguigna, frequenza cardiaca, abitudini di vita, condizioni mediche.
    "Richiesta": richiede informazioni o analisi dei dati dell'utente (dati storici, statistiche, ultimi dati inseriti, visualizzazione dati). Esempi: richieste di dati storici, statistiche, ultimi dati inseriti, visualizzazione dati.
    "Generale": non fornisce dati specifici dell'utente né richiede informazioni basate sui suoi dati (saluti, domande generali sulla salute, domande non correlate alla salute, espressioni di stati d'animo). Esempi: saluti, domande generali sulla salute, domande non correlate alla salute, espressioni di stati d'animo.
    Casi particolari:
    Frasi che esprimono l'intenzione di fornire dati ma non li forniscono effettivamente sono classificate come "Generale".
    Input contenenti sia dati che richieste sono classificati come "Inserimento" se l'aspetto principale è la comunicazione del dato, e come "Richiesta" se l'aspetto principale è la domanda.
    Se l'input è ambiguo o non rientra chiaramente in nessuna delle tre categorie, dare priorità alla categoria "Generale".
    RISPONDI SOLO E SOLAMENTE CON LA CATEGORIA DI CLASSIFICAZIONE PIÙ APPROPRIATA.