- provider:
    name: "ollama.OllamaService"
    args:
      port: 11434
      host: "localhost"
  #models: ["llama3.1", "llama3.2:3b","llama3.2:1b","gemma2:2b","phi3.5:latest", "qwen2.5:0.5b", "qwen2.5:1.5b", "qwen2.5:3b", "qwen2.5:latest", "qwen2.5:14b", "qwen2.5:32b", "gemma2:27b", "llama3.1:70b", "mistral-small", "aya:35b", "qwen2.5:72b"]
  models: ["llama3.2:3b","llama3.2:1b","gemma2:2b","phi3.5:latest", "qwen2.5:0.5b", "qwen2.5:1.5b", "qwen2.5:3b"]

  classes: ["inserimento", "richiesta", "generale"]
  system: >
    Dato un input testuale, classifica la sua categoria come "Inserimento", "Richiesta" o "Generale".
    **"Inserimento"**: L'input fornisce informazioni sull'utente, come misurazioni di pressione sanguigna, frequenza cardiaca, abitudini di vita, condizioni mediche o eventi specifici.  L'input in questa categoria è tipicamente dichiarativo.  Esempi chiave:
    * Misurazioni esplicite di pressione sanguigna e/o frequenza cardiaca (es. "Pressione 120/80", "Frequenza cardiaca 72", "La mia pressione è 140/90 e la mia frequenza cardiaca è 80").  Anche variazioni come "Pressione sistolica 120, diastolica 80" o  espressioni parziali come "Sistolica 130" rientrano in questa categoria.
    * Informazioni sullo stile di vita (es. "Bevo alcol regolarmente", "Non fumo mai", "Cammino per almeno 30 minuti al giorno", "Ho un lavoro sedentario").
    * Condizioni mediche o eventi di salute (es. "Ho avuto un attacco di panico ieri sera", "Mi si è rotta l'auto", "Si è rotto il ginocchio", "Ho un trapianto di rene").
    * Azioni intraprese dall'utente riguardanti la salute (es. "Ho iniziato a meditare", "Ho smesso di bere bevande energetiche",  "ho iniziato una nuova dieta povera di grassi saturi").
    **"Richiesta"**: L'input richiede informazioni o analisi dei dati dell'utente.  L'input in questa categoria è tipicamente interrogativo e spesso include riferimenti temporali o richieste di specifiche metriche. Esempi chiave:
    * Richieste di dati storici (es. "Vorrei vedere le letture della pressione che ho registrato nell’ultima settimana", "Potrei vedere le ultime misurazioni della frequenza che ho registrato nell’ultimo mese?", "Qual è la mia media di pressione sanguigna degli ultimi 365 giorni?").
    * Richieste di statistiche o elaborazione dati (es. "Qual è la mia media di frequenza cardiaca di questa settimana?", "Dammi il grafico con andamento di pressione arteriosa nell'ultima settimana", "Mostrami tutte le mie misurazioni della pressione arteriosa?").
    * Richieste dell'ultimo dato inserito (es. "ultima misurazione della frequenza cardiaca", "Qual è il dato più recente", "Ricordami l'ultima misurazione").
    * Richieste di visualizzazione dati (es. "Dammi i dati", "Voglio la media dei miei dati registrati",  "Forniscimi tutte le mie misurazioni in un grafico?").
    **"Generale"**: L'input non fornisce dati specifici dell'utente né richiede informazioni basate sui suoi dati. Include saluti, domande generali sulla salute, domande non correlate alla salute o espressioni di stati d'animo. Esempi chiave:
    * Saluti e convenevoli (es. "Ciao", "Buongiorno", "Buonasera, assistente!").
    * Domande generali sulla salute o sull'ipertensione (es. "Come posso prevenire le malattie cardiache?", "Quali sono le cause principali dell’ipertensione?",  "Qual è un buon stile di vita che abbassa il rischio di sviluppare ipertensione?").
    * Domande o affermazioni non correlate alla salute (es. "Qual è il tuo genere di film preferito?", "Mi piacerebbe una torta per colazione", "Il mio amico sta male").
    * Espressioni di stati d'animo o richieste di aiuto generiche (es. "Aiutami, c'è qualcosa che non va", "Buongiorno, mi annoio").
    * Domande sulla funzionalità del sistema  (es. "Come si fa?", "Dati questi dati, crea un prompt").
    **Casi particolari**:
    * Frasi come "vorrei darti i miei valori di pressione" o "Potresti aiutarmi a registrare le mie nuove letture della pressione sanguigna?", pur non contenendo dati espliciti, vanno classificate come **"Generale"**, poiché esprimono l'intenzione di fornire dati ma non li forniscono effettivamente.
    * Input contenenti sia dati che richieste (es. "La mia pressione è 140/70, cosa posso fare?") vanno classificati come **"Inserimento"** se l'aspetto principale è la comunicazione del dato, e come **"Richiesta"** se l'aspetto principale è la domanda.  Nel caso specifico dell'esempio, la classificazione più appropriata è **"Inserimento"**.
    * Se l'input è ambiguo o non rientra chiaramente in nessuna delle tre categorie, dare priorità alla categoria **"Generale"**.

